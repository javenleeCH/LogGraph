name: Release

# 目的：发对外 release——把桌面端安装包（Windows / macOS / Linux）自动打到 GitHub Release。
# 触发：打 `v*` tag（如 v0.2.0）或手动 workflow_dispatch。
# 说明：
#   - 三平台各自出原生包：Windows→NSIS、macOS→dmg(arm64)、Linux→AppImage+deb。
#     tauri.conf.json 已移除 bundle.targets 限制，由各平台用默认打包目标。
#   - 未配置代码签名 / notarization / updater：
#       Windows 未签名（首次安装可能需放行 SmartScreen）；
#       macOS 未公证（首次打开可能需右键->打开 绕过 Gatekeeper）；
#       Linux AppImage 无需签名。
#     签名与公证是后续独立一轮，需对应 secrets / 证书。
#   - tauri-action 直接跑 `tauri build`（带打包），不绕开 package.json 的 --no-bundle 本地脚本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 发布前测试门禁
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装依赖
        # 不依赖 package-lock.json（该锁文件按 .gitignore 不入库），故用 npm install
        run: npm install

      - name: 引擎 / CLI 单测
        run: cargo test -p loggraph-engine -p loggraph-cli

      - name: 前端类型检查 + 单测
        run: npx tsc -b && npm test

  build:
    name: 构建并发布（${{ matrix.platform }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 签名密钥预检 + 规范化：放在最前面，5 秒内失败，而不是构建 12 分钟后才在签名步爆炸。
      # 背景（v0.2.4/v0.2.5 实测）：GitHub Secrets 的值可带换行/首尾空白/夹带文字，而 Rust
      # base64 解码对空白零容忍（Invalid symbol 10/32），且该错误只在构建末尾签名步才爆；
      # v0.2.5 的预检还抓到真实案例——Secret 里粘的根本不是合法私钥（疑似多行原文/公钥）。
      # 此处统一剥离 \r\n 与首尾空白，解码校验必须是 minisign **私钥**（公钥注释行也以
      # 'untrusted comment:' 开头，只看前缀会漏检），并输出指纹注解便于匿名诊断。
      - name: 预检并规范化签名密钥
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 为空——请到仓库 Settings → Secrets and variables → Actions，粘贴私钥文件内容（单行 base64，即 _t/loggraph-updater.key 的全部内容）。"
            exit 1
          fi
          # 指纹诊断：只暴露长度/解码结果/注释行（公开元数据，不含密钥材料），
          # 值不合法时据此精确判断粘错了什么（公钥 / 多行原文 / 夹带说明 / 截断）。
          # 注意：base64 -d 退出码非零必须硬失败——GNU base64 对内部垃圾字符会
          # "输出部分解码内容后报错"，若只看内容会让夹带文字的值蒙混过关，
          # 写进 $GITHUB_ENV 后 Rust 的严格解码照样挂（只是推迟到 12 分钟后）。
          if ! DECODED="$(printf '%s' "$KEY" | base64 -d 2>/dev/null)"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY base64 解码失败（规范化后长度=${#KEY}）——值里夹带了换行/空格/说明文字，或根本不是 base64。请只粘贴私钥文件中的那一行内容（约 348 字符，勿带引号/备注/空行）。"
            exit 1
          fi
          FIRSTLINE="$(printf '%s' "$DECODED" | head -1)"
          LINES="$(printf '%s' "$DECODED" | grep -c . || true)"
          echo "::notice::签名密钥指纹：规范化后长度=${#KEY}，base64 解码成功，非空行数=${LINES:-0}，首行=\"${FIRSTLINE:-（空）}\""
          case "$FIRSTLINE" in
            "untrusted comment: rsign encrypted secret key"|"untrusted comment: minisign encrypted secret key")
              if [ "${LINES:-0}" -lt 2 ]; then
                echo "::error::TAURI_SIGNING_PRIVATE_KEY 解码后只有注释行、缺少密钥本体——疑似粘贴被截断。请重新完整粘贴私钥文件内容。"
                exit 1
              fi
              ;;
            *)
              echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是合法的 minisign 私钥（解码后首行应为 'untrusted comment: rsign encrypted secret key' 且至少两行）。常见错误：粘了公钥（首行会是 minisign public key）、粘了多行原文、或值里夹带了换行/空格/说明文字。请到 Settings → Secrets 更新后重试。"
              exit 1
              ;;
          esac
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$KEY" >> "$GITHUB_ENV"
          echo "签名密钥预检通过（已剥离首尾空白/换行，经 \$GITHUB_ENV 注入后续步骤）"

      - name: 安装 Linux 系统依赖（仅 ubuntu）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装前端依赖
        # 不依赖 package-lock.json（该锁文件按 .gitignore 不入库），故用 npm install
        run: npm install

      - name: 构建并发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自签更新通道：minisign 密钥对自生成，**不需要付费代码签名证书**。
          # tauri-action 用它给产物签名并生成 latest.json，客户端用 tauri.conf.json 里的公钥校验。
          # 注意：TAURI_SIGNING_PRIVATE_KEY 不在此处设置——由上面的预检步骤剥离空白后
          # 经 $GITHUB_ENV 注入；此处若再设会被原始 secret 覆盖，重新引入污染风险。
          # 密码必须是"设为空字符串"而非"不设"：本密钥为空密码加密格式，env 缺失时
          # 签名器会交互式索要密码，CI 无 TTY 直接挂起（v0.2.4 三平台全挂的另一个疑点）。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'logGraph ${{ github.ref_name }}'
          # 注意：releaseDraft 曾为 true，导致产物构建出来却躺在草稿里、公开页面
          # 一个都看不到（"跑通 CI" ≠ "用户拿得到"）。改 false 后 tag 一推即发布。
          releaseBody: |
            logGraph 桌面版安装包，由 CI 自动构建。

            | 平台 | 产物 | 说明 |
            |---|---|---|
            | Windows | `*_x64-setup.exe`（NSIS） / `*.msi` | 未签名：首次运行可能被 SmartScreen 拦截，点「仍要运行」 |
            | macOS | `*.dmg`（aarch64） | 未签名：右键 → 打开，绕过 Gatekeeper |
            | Linux | `*.AppImage` / `*.deb` | AppImage 需 `chmod +x` 后执行 |

            未做付费代码签名，故在 body 说明首次安装的系统放行步骤；但**不**标 Pre-release
            （自签 updater 依赖 /releases/latest/download/latest.json，Pre-release 不进 latest 会 404）。
          releaseDraft: false
          # 必须是正式版（prerelease: false）：自签 updater 的 endpoint 指向
          # /releases/latest/download/latest.json，而 Pre-release 不进 latest，
          # 会让更新通道直接 404。未做代码签名证书是分发层面的放行问题（已写在
          # body 里），与版本成熟度无关，不该用 Pre-release 表示。
          prerelease: false
