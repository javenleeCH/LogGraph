name: Release

# 目的：发对外 release——把桌面端安装包（Windows / macOS / Linux）自动打到 GitHub Release。
# 触发：打 `v*` tag（如 v0.2.0）或手动 workflow_dispatch。
# 说明：
#   - 三平台各自出原生包：Windows→NSIS、macOS→dmg(arm64)、Linux→AppImage+deb。
#     tauri.conf.json 已移除 bundle.targets 限制，由各平台用默认打包目标。
#   - 未配置代码签名 / notarization / updater：
#       Windows 未签名（首次安装可能需放行 SmartScreen）；
#       macOS 未公证（首次打开可能需右键->打开 绕过 Gatekeeper）；
#       Linux AppImage 无需签名。
#     签名与公证是后续独立一轮，需对应 secrets / 证书。
#   - tauri-action 直接跑 `tauri build`（带打包），不绕开 package.json 的 --no-bundle 本地脚本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 发布前测试门禁
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装依赖
        # 不依赖 package-lock.json（该锁文件按 .gitignore 不入库），故用 npm install
        run: npm install

      - name: 引擎 / CLI 单测
        run: cargo test -p loggraph-engine -p loggraph-cli

      - name: 前端类型检查 + 单测
        run: npx tsc -b && npm test

  build:
    name: 构建并发布（${{ matrix.platform }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（仅 ubuntu）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: 安装前端依赖
        # 不依赖 package-lock.json（该锁文件按 .gitignore 不入库），故用 npm install
        run: npm install

      - name: 构建并发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'logGraph ${{ github.ref_name }}'
          releaseBody: '自动构建的桌面安装包（Windows NSIS / macOS dmg / Linux AppImage+deb）。详见 commit 历史。'
          releaseDraft: true
          prerelease: false
