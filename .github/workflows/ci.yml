name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 目的：把「构建偶发崩溃」这类问题从人工嘴里搬到机器上。
# 桌面端打包（tauri build）暂不进 CI——它需要 webkit2gtk 系统依赖，
# 会把单次流水线拉到 10 分钟以上；这里先守住类型 / 单测 / 前端构建 /
# 引擎单测四道关。前端单测前会用当前源码重建 cep wasm——keyScope 等
# 用例直连 wasm 引擎，不该依赖「人工提交的二进制是否记得重建」。

jobs:
  frontend:
    name: 前端（类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不指定 cache：package-lock.json 按 .gitignore 不入库，
          # setup-node 的 cache: 'npm' 会因找不到 lock 文件而直接失败

      - name: 安装依赖
        # 不依赖 package-lock.json（该锁文件按 .gitignore 不入库），故用 npm install
        run: npm install

      # 库内 wasm 二进制由验证机人工重建提交，可能落后于 engine/src/cep.rs；
      # CI 自己重建（首跑约 1 分钟，rust-cache 之后秒级），保证测试与前端
      # 构建跑的都是当前源码的引擎。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'cep-wasm -> cep-wasm/target'

      - name: 安装 wasm-bindgen-cli（版本随 cep-wasm/Cargo.toml 的 =x.y.z 同步）
        run: |
          VER=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)"[[:space:]]*$/\1/p' cep-wasm/Cargo.toml)
          test -n "$VER"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$VER/wasm-bindgen-$VER-x86_64-unknown-linux-musl.tar.gz" | tar xz
          install -Dm755 "wasm-bindgen-$VER-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: 重建 cep wasm（当前引擎形状）
        run: npm run build:wasm:cep

      - name: 重建 filter wasm（当前引擎形状）
        run: npm run build:wasm

      # wasm 冒烟（P1-3）：Node 直跑 3 个冒烟脚本（regex/cep/filter-agg，共 26 断言），
      # 验证 Web 端 wasm 与桌面 native 引擎跑同一份 engine 语义。失败即红。
      - name: wasm 冒烟（regex / cep / filter，26 断言）
        run: npm run test:wasm:all

      - name: 类型检查
        run: npx tsc -b

      # 单测 + 覆盖率门禁（P2-1）：@vitest/coverage-v8 对 src/sequence|filters|parser|io
      # 设阈值，跌破即红。阈值基线：2026-10-19 实测 Stmts 36.5 / Branch 37.6 /
      # Funcs 32.5 / Lines 37.1，见 vitest.config.ts。
      - name: 单元测试（含覆盖门禁）
        run: npm run test:coverage

      - name: 构建
        run: npm run build

  rust:
    name: Rust（engine + cli 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 只测不依赖 tauri 的两个 crate（src-tauri 需要 webkit2gtk）
      - name: 单元测试
        run: cargo test -p loggraph-engine -p loggraph-cli

      # 覆盖率门禁（P2-1 Rust 侧）：对「单一实现」语义核心 engine 设行覆盖阈值。
      # 基线（2026-10-19 本机 cargo llvm-cov 实测）：engine lines 88.34%。
      # 阈值取 85%，留 ~3 点余量防 CI 环境抖动；cli 薄壳（~50%）不纳入门禁。
      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: 覆盖率门禁（engine lines ≥ 85%）
        run: cargo llvm-cov -p loggraph-engine --fail-under-lines 85 --summary-only

      # 样本数据端到端验收（真实 CLI 二进制 + sample/ 故事线断言，见 scripts/verify-samples.mjs）
      - name: 构建 CLI
        run: cargo build -p loggraph-cli
      - name: 样本数据验收
        run: node scripts/verify-samples.mjs
