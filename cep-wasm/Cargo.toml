[package]
name = "cep-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM build of the Rust CEP (EPL-style sequence) matcher. Shares engine/src/cep.rs + expr.rs verbatim so the Web runs the exact same implementation as the desktop (Tauri) engine — eliminating the former TypeScript duplicate (SequenceMatcher.ts)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# 独立 crate：不并入根 workspace（根 workspace 只含 engine/cli/src-tauri），
# 避免 its 构建被 workspace 的 profile/dev-deps 干扰。
[workspace]

[dependencies]
# 与 engine 保持同版本（语义一致）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 必须与已安装的 wasm-bindgen-cli 版本一致（schema 校验）
wasm-bindgen = "=0.2.129"
