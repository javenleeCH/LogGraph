[package]
name = "loggraph-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "logGraph core engine: ripgrep-style search (grep-searcher) + CEP sequence matching"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 时间戳解析正则（parser::timestamp）
regex = "1"
# rg 同内核：grep-searcher（mmap + SIMD + memchr 行扫描）+ grep-regex（regex-automata 封装）
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4.33"
# 会话命中缓存内层锁（无中毒错误路径）
parking_lot = "0.12"

[dev-dependencies]
# 引擎性质测试（parser/expr/rules 全量性 + CEP 序列匹配 soundness，见 tests/properties.rs）
proptest = "1"
