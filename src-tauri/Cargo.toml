[package]
name = "loggraph"
version.workspace = true
description = "Perfetto-style log timeline analyzer with multi-filter correlation"
authors = ["logGraph"]
edition.workspace = true

# Tauri 移动端 / 桌面端通用库结构
[lib]
name = "loggraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust 原生日志解析引擎（时间戳/行解析正则；unicode 模式 + JS \s/\d 语义翻译，见 parser/timestamp.rs）
regex = "1"
# SQLite 数据驻留层（bundled 自带 SQLite 源码编译，无系统依赖）
rusqlite = { version = "0.32", features = ["bundled"] }
