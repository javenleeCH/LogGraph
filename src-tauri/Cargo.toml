[package]
name = "loggraph"
version.workspace = true
description = "Perfetto-style log timeline analyzer with multi-filter correlation"
authors = ["logGraph"]
edition.workspace = true

# Tauri 移动端 / 桌面端通用库结构
[lib]
name = "loggraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# GUI 二进制名与 CLI（cli/ 的 `loggraph`，契约 D7）区分开，避免共享 target 目录时互相覆盖
[[bin]]
name = "loggraph-app"
path = "src/main.rs"

[build-dependencies]
# 版本对齐说明：@tauri-apps/cli 在 build/dev 时校验「cargo crate 与 npm 包同名成对
# 版本的 major/minor 必须相等」（patch 可漂移）。本表须与 package.json / package-lock.json
# 的 @tauri-apps/* 实装版本按 minor 对齐，升级任何一侧都要同步另一侧。
tauri-build = { version = "2.7", features = [] }

[dependencies]
# devtools：release 构建也启用 DevTools（debug 构建默认自带；性能基准需在 release 下看网络请求计时）
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
# 自签更新通道：minisign 密钥对（自生成，不需要付费代码签名证书）。
# 私钥存于 GitHub Secrets，CI 用它给产物签名；公钥在 tauri.conf.json。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 引擎 crate（engine_* IPC 命令，契约 §6；零数据库直扫 + CEP + 规则校验）
loggraph-engine = { path = "../engine" }
# 锁原语（会话句柄 RwLock 快照读 + 分块缓存 Mutex；无中毒错误路径）
parking_lot = "0.12"
