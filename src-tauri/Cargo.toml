[package]
name = "loggraph"
version = "0.1.0"
description = "Perfetto-style log timeline analyzer with multi-filter correlation"
authors = ["logGraph"]
edition = "2021"

# Tauri 移动端 / 桌面端通用库结构
[lib]
name = "loggraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
